; PlatformIO project configuration
; Coin-operated water refill vending machine
; Project EMX-2026-WATERVENDO-01, eMathrix Technologies
;
; Two environments. Build and flash `debug` on the bench, `release` on any unit
; that will handle money. DEBUG is defined only in the debug environment --
; serial debug output must never ship in a build that takes coins.
;
;   pio run -e debug -t upload
;   pio run -e release -t upload
;   pio test -e native

[platformio]
default_envs = release
src_dir = src
include_dir = include
test_dir = test

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; -Wall -Wextra because a silent narrowing conversion in coin or volume
; arithmetic is a money bug, not a style problem.
build_flags =
  -Wall
  -Wextra

lib_deps =
  arduino-libraries/Servo @ ^1.2.1
  ; DS18B20 waterproof probe on the cold tank, Status screen only.
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^3.11.0

[env:debug]
build_type = debug
build_flags =
  ${env.build_flags}
  -DDEBUG

[env:release]
; No -DDEBUG. Verified in the Milestone 7 test pass.
build_flags =
  ${env.build_flags}

; Host-side unit tests for billing arithmetic and refund rounding. These run on
; the development machine, not the Mega. They cover integer math only -- the
; coin path itself cannot be signed off by simulation, see docs/scenarios.md.
[env:native]
platform = native
build_flags =
  -std=gnu++11
  -DUNIT_TEST
