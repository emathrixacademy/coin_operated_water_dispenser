; PlatformIO project configuration
; Coin-operated water refill vending machine
; Project EMX-2026-WATERVENDO-01, eMathrix Technologies
;
; Two shipping environments. Build and flash `debug` on the bench, `release` on
; any unit that will handle money. DEBUG is defined only in the debug
; environment -- serial debug output must never ship in a build that takes coins.
;
;   pio run -e debug -t upload
;   pio run -e release -t upload
;   pio test -e native
;
; NOTE: the AVR settings live in [avr] rather than [env] on purpose. Anything in
; [env] applies to EVERY environment including native, and a native build that
; inherits board = megaatmega2560 fails with "Unknown board ID".

[platformio]
default_envs = release
src_dir = src
include_dir = include
test_dir = test

[avr]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; -Wall -Wextra because a silent narrowing conversion in coin or volume
; arithmetic is a money bug, not a style problem.
build_flags =
  -Wall
  -Wextra

lib_deps =
  arduino-libraries/Servo @ ^1.2.1
  ; DS18B20 waterproof probe on the cold tank, Status screen only.
  paulstoffregen/OneWire @ ^2.3.8
  milesburton/DallasTemperature @ ^3.11.0

[env:debug]
extends = avr
build_type = debug
build_flags =
  ${avr.build_flags}
  -DDEBUG

[env:release]
extends = avr
; No -DDEBUG. Verified in the Milestone 7 test pass.

; Host-side unit tests for the billing arithmetic, the refund rounding and the
; EEPROM record framing. These run on the development machine, not the Mega.
;
; They cover integer math and byte framing ONLY. The coin path itself cannot be
; signed off by simulation -- see docs/scenarios.md, which requires real coins,
; both series, including wet ones.
;
; Only the Arduino-free translation units are built here. Each of these has no
; Arduino dependency BY DESIGN, precisely so the money math, the virgin-EEPROM
; path, the change-payout arithmetic and the fault priority ordering are
; testable off-target rather than only observable on hardware.
;
; If you add an Arduino call to any of them, these tests stop building and that
; logic stops being checked. Move the hardware access to the caller instead.
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<billing.cpp> +<eeprom_record.cpp> +<change_plan.cpp> +<fault_mask.cpp> +<calendar.cpp>
build_flags =
  -std=gnu++11
  -Wall
  -Wextra
  -DUNIT_TEST
  -I include
