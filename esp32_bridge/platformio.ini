; ESP32 display firmware for the water vendo. Two builds of the same code:
;
;   cyd35    the 3.5" ESP32 touchscreen (ESP32-3248S035C). Draws the screens
;            on its own LCD AND serves the same screen to a phone or laptop.
;   esp32dev a plain ESP32 dev board with no screen: the phone/laptop page
;            only. Used for testing before the LCD arrived.
;
; Both speak the line protocol in include/hmi.h of the main project, over
; Mega Serial2, and open a local WiFi hotspot (no internet, no cloud):
; join "WATERVENDO-TEST" (password emx-bench-01), open http://192.168.4.1
;
; WiFi is listed as out of scope in ENGINEERING_RULES.md for the client machine. The team
; asked for it on this thesis prototype (2026-10-25).
;
;   cd esp32_bridge
;   pio run -e cyd35 -t upload        (LCD board)
;   pio run -e esp32dev -t upload     (plain dev board)

[platformio]
default_envs = cyd35

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  links2004/WebSockets@2.4.1

[env:esp32dev]
board = esp32dev
build_flags =
  -DMEGA_RX_PIN=16
  -DMEGA_TX_PIN=17

; Mega link on the board's extension header: GPIO35 is input-only, which is
; fine for RX. CHECK THE SILKSCREEN on our unit before wiring -- the header
; pinout varies between batches of this board.
[env:cyd35]
board = esp32dev
build_flags =
  -DHAS_LCD
  -DMEGA_RX_PIN=35
  -DMEGA_TX_PIN=22
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX@1.1.16
